upstream taskboard {
    server app:8000;
}

# Basic abuse protection: 10 requests/second per IP, with a small burst.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    # Do not advertise the nginx version.
    server_tokens off;

    add_header X-Content-Type-Options    "nosniff"        always;
    add_header X-Frame-Options           "SAMEORIGIN"     always;
    add_header Referrer-Policy           "no-referrer-when-downgrade" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 512;

    client_max_body_size 1m;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    location / {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://taskboard;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Health endpoints: no rate limit, no access log noise.
    location ~ ^/(healthz|readyz)$ {
        access_log off;
        proxy_pass http://taskboard;
    }

    # Metrics are for Prometheus, not the public internet.
    # Restrict to private ranges; adjust to your own network.
    location /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://taskboard;
    }
}

